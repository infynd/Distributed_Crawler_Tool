spring.application.name=DatavesterExtractor
server.port=${SERVER_PORT:0}

# Role & Ingestion Settings
crawler.role=${CRAWLER_ROLE:master}
crawler.input.file=${CRAWLER_INPUT_FILE:}

# Crawler Cluster Worker Settings (can be overridden via command-line flags)
crawler.worker.id=0
crawler.worker.total=1
crawler.batch.size=300
crawler.concurrency=80

# Proxy Settings
proxy.host=shared-datacenter.geonode.com
proxy.port=9001
proxy.user=geonode_I9VIkE5vpo
proxy.password=714aa5b7-ba55-4e73-a285-987b2f3a1d96

# ====================================================================
# RABBITMQ BROKER SETTINGS
# ====================================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:crawler_admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:CrawlerSecurePass123!}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# Prefetch limit (Fair task distribution across workers)
spring.rabbitmq.listener.simple.prefetch=${RABBITMQ_PREFETCH:50}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Queues, Exchanges & Routing Keys
crawler.rabbitmq.exchange=crawler.direct.exchange
crawler.rabbitmq.queue.tasks=crawler.tasks.queue
crawler.rabbitmq.queue.results=crawler.results.queue
crawler.rabbitmq.queue.dlq=crawler.tasks.dlq

crawler.rabbitmq.routing.tasks=crawler.tasks.key
crawler.rabbitmq.routing.results=crawler.results.key
crawler.rabbitmq.routing.dlq=crawler.dlq.key

# ====================================================================
# PARQUET & MODE SETTINGS
# ====================================================================
crawler.mode=${CRAWLER_MODE:queue}
parquet.output.file=${PARQUET_OUTPUT_FILE:crawled_output.parquet}
parquet.flush.threshold=${PARQUET_FLUSH_THRESHOLD:5000}
